<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adaptive Load Balancer</title>
<style>
:root{
  --bg:#FBFBFD; --surface:#FFFFFF; --fill:#F5F5F7; --line:#D2D2D7; --ink:#1D1D1F; --muted:#6E6E73;
  --accent:#0071E3; --static:#86868B; --s1:#0071E3; --s2:#C45F00; --s3:#8944AB; --err:#D70015; --warn:#C45F00; --good:#248A3D;
  --nav:rgba(251,251,253,.72); --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
  --sans:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono:ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1C1C1E; --fill:#2C2C2E; --line:#38383A; --ink:#F5F5F7; --muted:#A1A1A6;
    --accent:#2997FF; --static:#8E8E93; --s1:#2997FF; --s2:#D67A00; --s3:#BF5AF2; --err:#FF453A; --warn:#FF9F0A; --good:#30D158;
    --nav:rgba(22,22,23,.72); --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --fill:#2C2C2E; --line:#38383A; --ink:#F5F5F7; --muted:#A1A1A6;
  --accent:#2997FF; --static:#8E8E93; --s1:#2997FF; --s2:#D67A00; --s3:#BF5AF2; --err:#FF453A; --warn:#FF9F0A; --good:#30D158;
  --nav:rgba(22,22,23,.72); --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font:17px/1.47 var(--sans); letter-spacing:-.01em; -webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
[hidden]{display:none!important}

/* translucent nav: content scrolls under it */
.nav{position:sticky; top:env(safe-area-inset-top,0px); z-index:10; background:var(--nav); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px); border-bottom:1px solid color-mix(in srgb, var(--line) 60%, transparent)}
@media (prefers-reduced-transparency: reduce){.nav{background:var(--bg); backdrop-filter:none; -webkit-backdrop-filter:none}}
.nav-in{max-width:1180px; margin:0 auto; padding:10px 20px; display:flex; align-items:center; gap:16px}
.brand{font:600 17px var(--display); letter-spacing:-.02em; white-space:nowrap}
.seg{position:relative; display:flex; gap:2px; background:var(--fill); border-radius:10px; padding:2px; overflow-x:auto; scrollbar-width:none; flex:1; min-width:0}
.seg::-webkit-scrollbar{display:none}
.seg button{position:relative; z-index:1; flex:none; border:0; background:none; color:var(--ink); font:500 13px var(--sans); padding:6px 12px; border-radius:8px; cursor:pointer; white-space:nowrap}
.seg .pill{position:absolute; top:2px; bottom:2px; left:0; width:0; background:var(--surface); border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.12); z-index:0; will-change:transform,width}
.conn{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); white-space:nowrap}
.conn i{width:8px; height:8px; border-radius:50%; background:var(--static)}
.conn.live i{background:var(--good)}

main{max-width:1180px; margin:0 auto; padding-inline:20px; padding-block:40px 80px}
.page{display:flex; flex-direction:column; gap:28px}
.eyebrow{font-size:14px; font-weight:600; color:var(--accent); margin:0; letter-spacing:0}
h1{font:700 clamp(40px,6.4vw,76px)/1.04 var(--display); letter-spacing:-.03em; margin:0; text-wrap:balance}
h2{font:700 clamp(30px,4.2vw,48px)/1.08 var(--display); letter-spacing:-.025em; margin:0; text-wrap:balance}
h3{font:600 21px/1.2 var(--display); letter-spacing:-.015em; margin:0}
.lede{font-size:21px; line-height:1.4; color:var(--muted); margin:0; max-width:62ch; letter-spacing:-.015em}
p{margin:0}
.head{display:flex; flex-direction:column; gap:10px}
.card{background:var(--surface); border:1px solid color-mix(in srgb, var(--line) 55%, transparent); border-radius:20px; padding:24px; display:flex; flex-direction:column; gap:14px; box-shadow:var(--shadow); min-width:0}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px}
@media (max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}
.muted{color:var(--muted)}
.small{font-size:13px; letter-spacing:.005em}
ul.plain{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:6px}

/* buttons respond on press */
.btn{font:500 15px var(--sans); border:0; border-radius:980px; padding:10px 20px; cursor:pointer; background:var(--accent); color:#fff; transition:transform 100ms ease-out, opacity 120ms; align-self:flex-start}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--fill); color:var(--ink)}
.btn[disabled]{opacity:.45; cursor:not-allowed; transform:none}
.btn:focus-visible,.seg button:focus-visible,.chip:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{font:500 13px var(--sans); border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:980px; padding:5px 12px; cursor:pointer; transition:transform 100ms ease-out}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.bar{height:6px; background:var(--fill); border-radius:3px; overflow:hidden}
.bar i{display:block; height:100%; width:0; background:var(--accent); border-radius:3px; transition:width .6s ease}
pre.log{margin:0; font:12px/1.5 var(--mono); background:var(--fill); border-radius:12px; padding:12px; max-height:140px; overflow:auto; white-space:pre-wrap; color:var(--muted)}
.source{align-self:flex-start; font-size:13px; font-weight:500; border-radius:980px; padding:5px 12px; background:var(--fill); color:var(--muted)}
.source.live{color:var(--good)}

/* big numbers */
.tiles{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px}
@media (max-width:640px){.tiles{grid-template-columns:1fr}}
.tile{display:flex; flex-direction:column; gap:4px}
.tile .v{font:700 clamp(36px,5vw,56px)/1 var(--display); letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.tile .l{font-size:14px; color:var(--muted)}
.tile.accent .v{color:var(--accent)}

/* charts */
.chart svg{display:block; width:100%; height:auto; overflow:visible}
.chart text{font:12px var(--sans); fill:var(--muted)}
.chart .val{font:600 13px var(--sans); fill:var(--ink); font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--line); stroke-width:1}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:10px; height:10px; border-radius:3px; display:inline-block}
.tip{position:absolute; pointer-events:none; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:12px; box-shadow:0 4px 16px rgba(0,0,0,.12); white-space:nowrap; font-variant-numeric:tabular-nums; z-index:5}
.tbl{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:15px; font-variant-numeric:tabular-nums}
th,td{text-align:left; padding:10px 12px; border-bottom:1px solid color-mix(in srgb, var(--line) 60%, transparent)}
th{font-size:13px; font-weight:600; color:var(--muted)}
td.num,th.num{text-align:right}

/* animation */
.anim .panels{display:grid; grid-template-columns:1fr 1fr; gap:16px}
@media (max-width:760px){.anim .panels{grid-template-columns:1fr}}
.anim canvas{width:100%; aspect-ratio:16/9; display:block; border-radius:14px; background:var(--fill)}
.anim .ph{display:flex; justify-content:space-between; font-size:14px; gap:8px}
.anim .ph b{font-weight:600}
.anim .row{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.anim .tl{flex:1; min-width:160px; height:6px; background:var(--fill); border-radius:3px; position:relative}
.anim .tl .f{position:absolute; inset:0 auto 0 0; width:0; background:var(--accent); border-radius:3px}
.anim .tl .m{position:absolute; top:-4px; width:2px; height:14px; background:var(--warn)}
.anim .clock{font:12px var(--mono); color:var(--muted); min-width:84px; text-align:right}
.anim .stats{display:flex; gap:20px; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.anim .stats b{color:var(--ink); font-weight:600}

/* steps + topology */
.steps{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:14px}
@media (max-width:900px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}
.step .n{font:700 28px var(--display); color:var(--accent)}
.formula{font:600 clamp(18px,2.4vw,26px)/1.3 var(--mono); letter-spacing:-.01em}
.topo text{font:600 13px var(--sans)}
.hero{padding-block:24px 8px}
@media (prefers-reduced-motion: reduce){ .bar i,.btn,.chip{transition:none} }
</style>
</head>

      if(Math.abs(pill.x-pill.tx)<.3&&Math.abs(pill.vx)<.5&&Math.abs(pill.w-pill.tw)<.3){pill.x=pill.tx;pill.w=pill.tw;paintPill();pill.raf=0;return}
      pill.raf=requestAnimationFrame(tick)};
    pill.raf=requestAnimationFrame(tick)}
}

/* ---------- charts ---------- */
function barChart(key,s,a){
  const M=METRIC[key], vs=val(s,key), va=val(a,key), max=Math.max(vs||0,va||0)||1, W=360, bw=200;
  const row=(y,label,v,color)=>`<text x="0" y="${y+15}">${label}</text><rect x="80" y="${y}" width="${Math.max(2,bw*(v||0)/max)}" height="22" rx="4" fill="${color}"><title>${label}: ${fmt(v,M.unit)}</title></rect><text class="val" x="${86+bw*(v||0)/max}" y="${y+15}">${fmt(v,M.unit)}</text>`;
  const note=M.better?(M.better==='lower'?'lower is better':'higher is better'):'';
  return `<div class="card chart"><h3 style="font-size:17px">${M.label}</h3><p class="small muted">${note}</p><svg viewBox="0 0 ${W} 70" role="img" aria-label="${M.label}: static ${fmt(vs,M.unit)}, adaptive ${fmt(va,M.unit)}">${row(4,'Static',vs,'var(--static)')}${row(40,'Adaptive',va,'var(--accent)')}</svg></div>`;
}
function timeline(run,title){
  const tl=run.timeline, n=Math.max(1,run.duration), W=600, H=200, L=34, B=24, T=8;
  let max=1; for(let i=0;i<n;i++) for(const k of [...SRV,'err']) max=Math.max(max,tl[k][i]||0);
  max=Math.ceil(max/10)*10;
  const x=i=>L+(W-L-8)*i/(n-1||1), y=v=>T+(H-T-B)*(1-v/max);
  const line=k=>`<path d="${[...Array(n).keys()].map(i=>(i?'L':'M')+x(i).toFixed(1)+' '+y(tl[k][i]||0).toFixed(1)).join(' ')}" fill="none" stroke="var(--${k.replace('srv','s')})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const bw=Math.max(2,(W-L-8)/n*.6);
  const errs=[...Array(n).keys()].filter(i=>tl.err[i]).map(i=>`<rect x="${x(i)-bw/2}" y="${y(tl.err[i])}" width="${bw}" height="${H-B-y(tl.err[i])}" rx="2" fill="var(--err)" opacity=".75"/>`).join('');
  const ticks=[0,max/2,max].map(v=>`<line class="grid" x1="${L}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('');
  const xt=[...Array(n).keys()].filter(i=>i%5===0).map(i=>`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${i}s</text>`).join('');
  const evx=run.event_offset!=null?x(run.event_offset):null;
  const ev=evx!=null?`<line x1="${evx}" x2="${evx}" y1="${T}" y2="${H-B}" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${evx+4}" y="${T+10}" style="fill:var(--warn)">event</text>`:'';
  const id='tl'+Math.random().toString(36).slice(2,8);
  setTimeout(()=>hover(id,run,x,n),0);
  return `<div class="card chart"><h3 style="font-size:17px">${title}</h3>
    <div class="legend">${SRV.map(k=>`<span><i style="background:var(--${k.replace('srv','s')})"></i>${k}</span>`).join('')}<span><i style="background:var(--err)"></i>failed</span></div>
    <div style="position:relative" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}: requests per second per server over time">${ticks}${xt}${errs}${SRV.map(line).join('')}${ev}<line class="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1" opacity="0"/></svg><div class="tip" hidden></div></div>
    <p class="small muted">Successful requests per second, by the server that answered.</p></div>`;
}
function hover(id,run,x,n){
  const box=document.getElementById(id); if(!box) return; const svg=box.querySelector('svg'),tip=box.querySelector('.tip'),xh=svg.querySelector('.xh');
  svg.addEventListener('pointermove',e=>{const r=svg.getBoundingClientRect(),vx=(e.clientX-r.left)/r.width*600;
    let i=Math.round((vx-34)/(600-42)*(n-1)); i=Math.max(0,Math.min(n-1,i));
    xh.setAttribute('x1',x(i));xh.setAttribute('x2',x(i));xh.setAttribute('opacity','.6');
    tip.hidden=false; tip.innerHTML=`<b>${i} s</b><br>${SRV.map(k=>`${k}: ${run.timeline[k][i]||0}`).join('<br>')}<br>failed: ${run.timeline.err[i]||0}`;
    const px=(x(i)/600)*r.width; tip.style.left=Math.min(r.width-120,px+10)+'px'; tip.style.top='8px'});
  svg.addEventListener('pointerleave',()=>{tip.hidden=true;xh.setAttribute('opacity','0')});
}

      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="p95 latency against number of client threads for static and adaptive">${[0,max/2,max].map(v=>`<line class="grid" x1="${L}" x2="${W-20}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('')}${th.map((t,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${t*3} threads</text>`).join('')}${path(S,'var(--static)')}${path(A,'var(--accent)')}</svg></div>

async function api(path,opt){ const r=await fetch(path,Object.assign({cache:'no-store'},opt)); const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||('HTTP '+r.status)); return j }
async function loadResults(){
  try{ const ctl=new AbortController(); setTimeout(()=>ctl.abort(),3000); const d=await api('/api/results',{signal:ctl.signal}); LIVE=true; MACHINE=d.machine; RUNS=d.runs }catch{ LIVE=false; RUNS=REF }
  const c=$('#conn'); c.classList.toggle('live',LIVE); c.lastElementChild.textContent=LIVE?('VM: '+MACHINE.host):'Offline';
  document.querySelectorAll('[data-run],#runTests').forEach(b=>b.disabled=!LIVE);
  if(!LIVE) document.querySelectorAll('.runcard .status').forEach(p=>p.textContent='Open this page on the VM to run: sudo -E python3 dashboard/server.py, then http://localhost:8000');
  renderAll();
}
async function startRun(sc,dur){
  const card=$(`.runcard[data-sc="${sc}"]`), st=card.querySelector('.status');
  try{ await api('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scenario:sc,duration:dur})}); st.textContent='Starting…'; poll() }
  catch(e){ st.textContent=e.message }
}
let polling=false, wasRunning=false;
async function poll(){
  if(polling||!LIVE) return; polling=true;
  try{ while(true){ JOB=await api('/api/status'); paintJob(); if(!JOB.running){ if(wasRunning){wasRunning=false; await loadResults(); paintJob(true)} break } wasRunning=true; await new Promise(r=>setTimeout(r,1500)) } }
  catch{} polling=false;
}
function paintJob(done){
  document.querySelectorAll('.runcard').forEach(card=>{
    const sc=card.dataset.sc, btn=card.querySelector('[data-run]'), bar=card.querySelector('.bar'), st=card.querySelector('.status'), log=card.querySelector('.log');
    const mine=JOB&&JOB.scenario===sc;
    btn.disabled=!LIVE||(JOB&&JOB.running);
    if(JOB&&JOB.running&&mine){ const per=(+card.querySelector('.chip[aria-pressed="true"]').dataset.d)+14; const el=JOB.now-JOB.started; bar.hidden=false; bar.firstElementChild.style.width=Math.min(97,el/(per*JOB.steps)*100)+'%';
      st.textContent=`Run ${JOB.step} of ${JOB.steps}: ${JOB.label} · ${Math.round(el)} s`; log.hidden=false; log.textContent=JOB.log.slice(-8).join('\n'); log.scrollTop=log.scrollHeight }
    else if(JOB&&JOB.running){ st.textContent=`Waiting: ${JOB.label} is running in another tab.` }
    else if(mine&&(done||JOB.finished)){ bar.hidden=false; bar.firstElementChild.style.width='100%'; st.textContent=JOB.error?('Failed: '+JOB.error):`Finished ${new Date(JOB.finished*1000).toLocaleTimeString()}. Results below are from this VM.`; log.hidden=!JOB.error; log.textContent=JOB.log.slice(-12).join('\n') }
    else if(LIVE){ st.textContent=liveHas(sc)?'Results below were measured on this VM.':'Not run on this VM yet.' }
  });
}
async function runTests(){
  const s=$('#testStatus'), o=$('#testOut'), b=$('#runTests'); b.disabled=true; s.textContent='Running…';
  try{ const r=await api('/api/tests',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}); s.innerHTML=r.ok?'<b style="color:var(--good)">All tests passed</b>':'<b style="color:var(--err)">Some tests failed</b>'; o.hidden=false; o.textContent=r.output }
  catch(e){ s.textContent=e.message } b.disabled=!LIVE;
}

/* ---------- animation (slowed down) ---------- */
const Anim=(()=>{
  const DUR=30, EVT=11, SEG=.42, WORK=1.0, DETECT=2;
  const P={h1:[.07,.2],h2:[.07,.4],h3:[.07,.6],h4:[.07,.8],s1:[.31,.5],s2:[.55,.27],s3:[.55,.73],srv1:[.85,.14],srv2:[.85,.4],srv3:[.85,.73]};
  const SC={intro:{},e1:{},e2:{weak:true},e3:{ev:'hot'},e4:{ev:'kill'},e5:{ev:'congest'},e6:{ramp:true}};
  const cards={}; let activeId=null, last=0, C={};
  function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
  function make(mode,sc,seed){const S={mode,sc,r:rng(seed),t:0,done:0,failed:0,share:[0,0,0],rr:0,reqs:[],events:[],users:[],iperf:[],lastSnap:0};
    S.servers=SRV.map((n,i)=>({n,i,sw:i<2?'s2':'s3',link:i<2?'A':'B',cap:4,slow:1,active:0,busy:0,queue:[],dead:false,knownDead:false,drain:false,snap:0,transit:0,lastHeard:0}));
    if(sc.weak){S.servers[2].cap=1;S.servers[2].slow=2.2}
    for(let k=0;k<(sc.ramp?3:12);k++)S.users.push({c:['h1','h2','h3'][k%3],next:S.r()*2,busy:false});return S}
  const cong=S=>S.sc.ev==='congest'&&S.t>=EVT;
  const segT=(S,a,b)=>((a==='s1'&&b==='s2')||(a==='s2'&&b==='s1'))&&cong(S)?SEG*3.5:SEG;
  function pickSrv(S){if(S.mode==='static')return S.servers[S.rr++%3];
    let pool=S.servers.filter(s=>!s.knownDead&&!s.drain); if(!pool.length)pool=S.servers.filter(s=>!s.knownDead); if(!pool.length)pool=S.servers;
    let best=pool[0],bs=1e9; for(const s of pool){const v=.7*(s.snap+s.transit)/s.cap+.3*(cong(S)&&s.link==='A'?.95:0)+S.r()*1e-3; if(v<bs){bs=v;best=s}} return best}
  function start(S,q){const s=q.s;s.busy++;q.phase='work';q.until=S.t+(q.direct?WORK*3:WORK*s.slow*(.8+S.r()*.4))}
  function step(S,dt){S.t+=dt;const t=S.t,sc=S.sc;
    if(sc.ev==='kill'&&t>=EVT&&!S.servers[1].dead){const s=S.servers[1];s.dead=true;s.active=s.busy=0;for(const q of S.reqs)if(q.s===s&&(q.phase==='work'||q.phase==='wait')){q.phase='fail';q.until=t+1}s.queue=[]}
    if(sc.ramp){const want=3+Math.floor(21*Math.min(1,t/(DUR-3)));while(S.users.length<want)S.users.push({c:['h1','h2','h3'][S.users.length%3],next:t,busy:false})}
    if(sc.ev==='hot'&&t>=EVT&&S.reqs.filter(q=>q.direct).length<6)S.reqs.push({direct:true,s:S.servers[0],path:['h4','s1','s2','srv1'],seg:0,prog:0,phase:'out'});
    if(t-S.lastSnap>=.25){S.lastSnap=t;for(const s of S.servers)if(!s.dead){s.snap=s.active;s.lastHeard=t;const L=s.active/s.cap;s.drain=s.drain?L>=.7:L>=.9}}
    for(const s of S.servers)if(s.dead&&!s.knownDead&&t-s.lastHeard>DETECT){s.knownDead=true;S.events.push(s.n+' marked down, no longer used')}
    for(const u of S.users)if(!u.busy&&t>=u.next){u.busy=true;const s=pickSrv(S);s.transit++;S.reqs.push({u,s,path:[u.c,'s1',s.sw,s.n],seg:0,prog:0,phase:'out'})}
    const keep=[];for(const q of S.reqs){
      if(q.phase==='out'||q.phase==='back'){q.prog+=dt/segT(S,q.path[q.seg],q.path[q.seg+1]);
        if(q.prog>=1){q.seg++;q.prog=0;if(q.seg>=q.path.length-1){
          if(q.phase==='out'){const s=q.s;if(!q.direct)s.transit=Math.max(0,s.transit-1);if(s.dead){q.phase='fail';q.until=t+1}else{s.active++;if(s.busy<s.cap)start(S,q);else{q.phase='wait';s.queue.push(q)}}}
          else{if(!q.direct){S.done++;S.share[q.s.i]++;q.u.busy=false;q.u.next=t+.2}continue}}}}
      else if(q.phase==='work'&&t>=q.until){const s=q.s;s.busy--;s.active--;const nx=s.queue.shift();if(nx)start(S,nx);q.phase='back';q.path=q.path.slice().reverse();q.seg=0;q.prog=0}
      else if(q.phase==='fail'&&t>=q.until){if(!q.direct){S.failed++;q.u.busy=false;q.u.next=t+.5}continue}
      keep.push(q)}
    S.reqs=keep;
    if(cong(S)){if(S.r()<.35)S.iperf.push({p:0});for(const x of S.iperf)x.p+=dt/1.2;S.iperf=S.iperf.filter(x=>x.p<1)}}
  function colors(){const cs=getComputedStyle(document.documentElement);for(const k of ['surface','fill','line','ink','muted','static','accent','warn','err'])C[k]=cs.getPropertyValue('--'+k).trim()}
  const pt=(n,w,h)=>[P[n][0]*w,P[n][1]*h];
  function rr(g,x,y,w,h,r){g.beginPath();g.roundRect?g.roundRect(x,y,w,h,r):g.rect(x,y,w,h)}
  const F=getComputedStyle(document.body).fontFamily;
  function draw(cv,S){const g=cv.getContext('2d'),w=cv.width,h=cv.height,u=w/640;
    g.fillStyle=C.fill;g.fillRect(0,0,w,h);
    for(const [a,b] of [['h1','s1'],['h2','s1'],['h3','s1'],['h4','s1'],['s1','s2'],['s1','s3'],['s2','srv1'],['s2','srv2'],['s3','srv3']]){const A=pt(a,w,h),B=pt(b,w,h),hot=a==='s1'&&b==='s2'&&cong(S);g.beginPath();g.moveTo(...A);g.lineTo(...B);g.strokeStyle=hot?C.warn:C.line;g.lineWidth=(hot?8:3)*u;g.lineCap='round';g.stroke()}
    g.textAlign='center';g.textBaseline='middle';g.font=`600 ${15*u}px ${F}`;
    const ma=[(P.s1[0]+P.s2[0])/2*w,(P.s1[1]+P.s2[1])/2*h],mb=[(P.s1[0]+P.s3[0])/2*w,(P.s1[1]+P.s3[1])/2*h];
    g.fillStyle=cong(S)?C.warn:C.muted;g.fillText(cong(S)?'Link A (busy)':'Link A',ma[0]-54*u,ma[1]-16*u);g.fillStyle=C.muted;g.fillText('Link B',mb[0]-54*u,mb[1]+16*u);
    for(const x of S.iperf){const sg=x.p<.5?['h4','s1',x.p*2]:['s1','s2',(x.p-.5)*2],A=pt(sg[0],w,h),B=pt(sg[1],w,h);g.fillStyle=C.warn;g.fillRect(A[0]+(B[0]-A[0])*sg[2]-5*u,A[1]+(B[1]-A[1])*sg[2]-2.5*u,10*u,5*u)}
    for(const c of ['h1','h2','h3','h4']){const [x,y]=pt(c,w,h);g.fillStyle=C.surface;g.beginPath();g.arc(x,y,20*u,0,7);g.fill();g.fillStyle=C.ink;g.font=`600 ${14*u}px ${F}`;g.fillText(c,x,y)}
    for(const s of ['s1','s2','s3']){const [x,y]=pt(s,w,h);g.fillStyle=C.ink;rr(g,x-38*u,y-24*u,76*u,48*u,10*u);g.fill();g.fillStyle=C.surface;g.font=`600 ${17*u}px ${F}`;g.fillText(s,x,y)}
    for(const s of S.servers){const [x,y]=pt(s.n,w,h),bw=116*u,bh=58*u;g.fillStyle=C.surface;rr(g,x-bw/2,y-bh/2,bw,bh,10*u);g.fill();if(s.dead){g.strokeStyle=C.err;g.lineWidth=2.5*u;g.stroke()}
      g.textAlign='left';g.fillStyle=C.ink;g.font=`600 ${14*u}px ${F}`;g.fillText(s.n,x-bw/2+10*u,y-bh/2+14*u);
      const sz=15*u,gp=5*u;for(let k=0;k<s.cap;k++){g.fillStyle=k<s.busy?(S.mode==='static'?C.static:C.accent):C.line;rr(g,x-bw/2+10*u+k*(sz+gp),y+2*u,sz,sz,4*u);g.fill()}
      let tag='',tc=C.muted;if(s.dead){tag=S.mode==='adaptive'&&s.knownDead?'marked down':'down';tc=C.err}else if(s.drain&&S.mode==='adaptive'){tag='draining';tc=C.warn}else if(s.queue.length){tag='queue '+s.queue.length;tc=C.warn}
      g.textAlign='center';g.fillStyle=tc;g.font=`600 ${13*u}px ${F}`;g.fillText(tag,x,y+bh/2+13*u);
      if(s.dead){g.strokeStyle=C.err;g.lineWidth=3*u;g.beginPath();g.moveTo(x-bw/2+8*u,y+bh/2-8*u);g.lineTo(x+bw/2-8*u,y-bh/2+8*u);g.stroke()}}
    const col=S.mode==='static'?C.static:C.accent;
    for(const q of S.reqs){if(q.phase==='work'||q.phase==='wait')continue;let x,y;
      if(q.phase==='fail'){[x,y]=pt(q.s.n,w,h);x-=86*u}else{const A=pt(q.path[q.seg],w,h),B=pt(q.path[q.seg+1],w,h),e=q.prog;x=A[0]+(B[0]-A[0])*e;y=A[1]+(B[1]-A[1])*e}
      g.globalAlpha=q.phase==='back'?.5:1;g.fillStyle=q.phase==='fail'?C.err:q.direct?C.warn:col;g.beginPath();g.arc(x,y,(q.phase==='fail'?8:6)*u,0,7);g.fill();g.globalAlpha=1;
      if(q.phase==='fail'){g.strokeStyle=C.surface;g.lineWidth=2*u;g.beginPath();g.moveTo(x-3.5*u,y-3.5*u);g.lineTo(x+3.5*u,y+3.5*u);g.moveTo(x+3.5*u,y-3.5*u);g.lineTo(x-3.5*u,y+3.5*u);g.stroke()}}
    const ev=S.events[S.events.length-1];if(ev&&S.mode==='adaptive'){g.textAlign='left';g.fillStyle=C.accent;g.font=`600 ${15*u}px ${F}`;g.fillText('Ryu: '+ev,18*u,h-18*u)}}
  function init(){colors();document.querySelectorAll('[data-anim]').forEach(el=>{const id=el.dataset.anim;const c={el,id,cv:[...el.querySelectorAll('canvas')],playing:!reduce,sims:null};cards[id]=c;
      el.querySelector('[data-a="play"]').addEventListener('click',()=>{c.playing=!c.playing;label(c)});el.querySelector('[data-a="replay"]').addEventListener('click',()=>{reset(c);c.playing=true;label(c)});
      const m=el.querySelector('.m');const sc=SC[id]||{};m.hidden=!sc.ev;m.style.left=(EVT/DUR*100)+'%';reset(c);label(c)});
    addEventListener('resize',size);matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{colors();paintAll()});
    new MutationObserver(()=>{colors();paintAll()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
    requestAnimationFrame(frame)}
  function label(c){c.el.querySelector('[data-a="play"]').textContent=c.playing?'Pause':'Play'}
  function reset(c){const sc=SC[c.id]||{};c.sims=[make('static',sc,7),make('adaptive',sc,7)];for(const S of c.sims)for(let k=0;k<300;k++)step(S,1/120);size();}
  function size(){const dpr=Math.min(2,devicePixelRatio||1);for(const c of Object.values(cards))for(const cv of c.cv){const w=cv.clientWidth||600;cv.width=Math.round(w*dpr);cv.height=Math.round(w*9/16*dpr)}paintAll()}
  function paint(c){c.sims.forEach((S,k)=>{draw(c.cv[k],S);const col=c.cv[k].parentElement,tot=S.share.reduce((a,b)=>a+b,0)||1;col.querySelector('[data-k="done"]').textContent=S.done;col.querySelector('[data-k="failed"]').textContent=S.failed;col.querySelector('[data-k="share"]').textContent=S.share.map(v=>Math.round(v/tot*100)+'%').join(' / ')});
    const t=c.sims[0].t;c.el.querySelector('.f').style.width=Math.min(100,t/DUR*100)+'%';c.el.querySelector('.clock').textContent=Math.floor(t)+' s / '+DUR+' s'}
  function paintAll(){for(const c of Object.values(cards))if(c.sims)paint(c)}
  function frame(ts){const dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;const c=cards[activeId==='how'?'intro':activeId];
    if(c&&c.playing&&dt>0){for(const S of c.sims){const n=Math.ceil(dt*120);for(let k=0;k<n;k++)step(S,dt/n)}if(c.sims[0].t>=DUR)reset(c);paint(c)}
    requestAnimationFrame(frame)}
  return {init, activate(id){activeId=id;last=0;requestAnimationFrame(size)}};
})();

buildPages();
Anim.init();
show(location.hash.slice(1)||'overview');
addEventListener('resize',movePill);
loadResults().then(()=>{ if(LIVE) poll() });
</script>
